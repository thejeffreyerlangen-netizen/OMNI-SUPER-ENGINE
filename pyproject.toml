[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-super-engine"
version = "8.2.0"
description = "Quantum-Topological Simulation Framework: symplectic invariants, relativistic rocketry, path-integral Monte Carlo, neural operators, and TDA-lite"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "OMNI Development"}
]
keywords = [
    "physics", "simulation", "symplectic", "path-integral",
    "topology", "relativistic", "navier-stokes", "neural-operator"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
scipy = ["scipy>=1.9"]
full = ["torch>=2.0", "scipy>=1.9"]
dev = ["pytest>=7.0", "torch>=2.0", "scipy>=1.9"]

[project.urls]
Homepage = "https://github.com/thejeffreyerlangen-netizen/OMNI-SUPER-ENGINE"
Repository = "https://github.com/thejeffreyerlangen-netizen/OMNI-SUPER-ENGINE"
Issues = "https://github.com/thejeffreyerlangen-netizen/OMNI-SUPER-ENGINE/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["omni_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
