[project]
name = "omni_super_engine"
version = "8.2.0"
description = "Super Engine Omni v8.2 (deterministic simulation framework)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pytest>=7.0.0",
    "matplotlib>=3.5.0"
]
